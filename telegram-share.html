<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111111">
  <meta name="shyfr-share-build" content="shyfr-ua-pages-20">
  <title>Надіслати результат ШИФР</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px 16px}
    main{width:min(100%,520px)}h1{margin:0 0 10px;text-align:center;font-size:28px;line-height:1.15}.lead{margin:0 0 26px;text-align:center;opacity:.72;font-size:16px;line-height:1.4}
    button,a.action{width:100%;min-height:60px;border:0;border-radius:16px;padding:0 18px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;text-decoration:none}
    .note{margin-top:20px;text-align:center;font-size:13px;line-height:1.45;opacity:.56}.error{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;background:#2b1c1c;color:#ffd7d7;font-size:14px;line-height:1.4}
    #returnBox,#refreshBox{display:none;margin-top:14px} a.action.secondary{background:#292929;color:#fff}
  </style>
</head>
<body>
<main>
  <h1>📤 Надіслати результат</h1>
  <p class="lead">Оберіть чат у Telegram</p>
  <button id="share" type="button">📤 Вибрати чат</button>
  <div id="refreshBox"><a id="refreshLink" class="action secondary" href="#">↩️ Відкрити надсилання в ШИФРІ</a></div>
  <div id="returnBox"><a id="returnLink" class="action" href="#">↩️ Повернутися в ШИФР</a></div>
  <p id="note" class="note">Після успішного надсилання +1 шанс зарахується автоматично.</p>
  <div id="error" class="error"></div>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var preparedId=q.get('pm')||'';
  var ticket=q.get('ticket')||'';
  var gameDate=q.get('gd')||'';
  var bot=(q.get('bot')||'Shyfr_ua_bot').replace(/^@/,'');
  var isFresh=q.get('fresh')==='1';
  var tg=window.Telegram&&window.Telegram.WebApp;
  var button=document.getElementById('share');
  var note=document.getElementById('note');
  var errorBox=document.getElementById('error');
  var refreshBox=document.getElementById('refreshBox');
  var refreshLink=document.getElementById('refreshLink');
  var returnBox=document.getElementById('returnBox');
  var returnLink=document.getElementById('returnLink');
  var inProgress=false;
  var lastShareError='';

  function showError(message){errorBox.textContent=message;errorBox.style.display='block'}
  function clearError(){errorBox.style.display='none'}
  function showRefresh(message){
    if(message)note.textContent=message;
    refreshBox.style.display='block';
  }
  function errorText(code){
    if(code==='USER_DECLINED')return 'Надсилання скасовано. Шанс не нараховано.';
    if(code==='MESSAGE_EXPIRED'||code==='ID_EXPIRED')return 'Термін дії старої кнопки минув. Натисніть «Оновити надсилання».';
    return 'Не вдалося надіслати результат. Оновіть надсилання та спробуйте ще раз.';
  }
  function shareFailed(data){
    lastShareError=String((data&&data.error)||'UNKNOWN_ERROR');
    if(lastShareError==='USER_DECLINED')note.textContent=errorText(lastShareError);
    else showRefresh(errorText(lastShareError));
  }
  function kyivToday(){
    var parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    var values={};parts.forEach(function(part){if(part.type!=='literal')values[part.type]=part.value});return values.year+'-'+values.month+'-'+values.day
  }
  function nonce(){
    try{
      var a=new Uint32Array(2);crypto.getRandomValues(a);
      return (a[0].toString(36)+a[1].toString(36)).slice(0,12);
    }catch(e){return (Date.now().toString(36)+'abcdef').slice(0,12)}
  }
  function returnToBot(){
    var n=nonce();
    var isToday=gameDate===kyivToday();
    var start='tgdone_'+ticket+'_'+n;
    var url='https://t.me/'+encodeURIComponent(bot)+(isToday?'?start='+encodeURIComponent(start):'');
    returnBox.style.display='block';
    returnLink.href=url;
    note.textContent=isToday?'Результат надіслано. Повертаємо Вас у ШИФР.':'Результат надіслано. За результати минулих днів шанси не нараховуються.';
    try{
      if(tg&&typeof tg.openTelegramLink==='function'){
        tg.openTelegramLink(url);
        setTimeout(function(){try{tg.close()}catch(e){}},350);
        return;
      }
    }catch(e){}
    try{window.location.href=url}catch(e){}
  }
  function runShare(){
    clearError();
    if(inProgress)return;
    lastShareError='';
    if(!tg||typeof tg.shareMessage!=='function'){
      showRefresh('Оновіть Telegram до актуальної версії та спробуйте ще раз.');
      return;
    }
    inProgress=true;
    button.disabled=true;
    note.textContent='Відкриваємо список чатів…';

    // Some Telegram Android builds may fail to invoke the callback if the
    // native picker itself fails to open. Never leave the UI locked forever.
    var unlockTimer=setTimeout(function(){
      if(!inProgress)return;
      inProgress=false;
      button.disabled=false;
      showRefresh('Не вдалося відкрити список чатів. Оновіть надсилання та спробуйте ще раз.');
    },3500);

    try{
      tg.shareMessage(preparedId,function(sent){
        clearTimeout(unlockTimer);
        inProgress=false;
        button.disabled=false;
        if(sent){returnToBot()}
        else if(lastShareError==='USER_DECLINED'){note.textContent=errorText(lastShareError)}
        else{showRefresh(errorText(lastShareError))}
      });
    }catch(e){
      clearTimeout(unlockTimer);
      inProgress=false;
      button.disabled=false;
      showRefresh('Не вдалося відкрити список чатів. Оновіть надсилання та спробуйте ще раз.');
    }
  }

  if(!preparedId||!/^[A-Za-z0-9_-]{20,64}$/.test(ticket)||
     !/^\d{4}-\d{2}-\d{2}$/.test(gameDate)||
     Number.isNaN(Date.parse(gameDate+'T00:00:00Z'))||gameDate>kyivToday()||
     !/^[A-Za-z0-9_]{3,64}$/.test(bot)){
    button.style.display='none';
    showError('Некоректне посилання на результат. Поверніться до бота.');
    return;
  }
  var refreshUrl='https://t.me/'+encodeURIComponent(bot)+'?start='+encodeURIComponent('tgrefresh_'+ticket);
  refreshLink.href=refreshUrl;
  refreshLink.addEventListener('click',function(event){
    try{if(tg&&typeof tg.openTelegramLink==='function'){
      event.preventDefault();
      tg.openTelegramLink(refreshUrl);
    }}catch(e){}
  });
  try{
    if(tg&&typeof tg.ready==='function')tg.ready();
    if(tg&&typeof tg.expand==='function')tg.expand();
    if(tg&&typeof tg.onEvent==='function')tg.onEvent('shareMessageFailed',shareFailed);
  }catch(e){}
  // Legacy prepared-message links always expire. Never start the native
  // shareMessage picker for a link that might be stale: some Android Telegram
  // versions hang showing a spinner instead of reporting MESSAGE_EXPIRED.
  button.style.display='none';
  showRefresh(gameDate===kyivToday()
    ? 'Ця кнопка створена за старим способом. Перейдіть у ШИФР, щоб одразу вибрати чат без обмеження часу.'
    : 'Для результату за попередній день перейдіть у ШИФР. За минулі дні нові шанси не нараховуються.');
  // Important: do not auto-run shareMessage on page load. Telegram Android
  // may reject that call without a fresh user gesture and never call back.
  // The native destination picker is opened only by this real button tap.
  button.addEventListener('click',runShare);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111111">
  <meta name="shyfr-share-build" content="shyfr-ua-pages-21">
  <title>Надіслати результат ШИФР</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px 16px}
    main{width:min(100%,520px)}h1{text-align:center;font-size:28px;margin:0 0 10px}
    .lead{text-align:center;opacity:.75;margin:0 0 26px}
    button,a.action{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;border:0;border-radius:16px;padding:0 18px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;background:#fff;color:#111;text-decoration:none}
    .note{margin-top:20px;text-align:center;opacity:.65;font-size:13px;line-height:1.5}
    .error{display:none;margin-top:18px;color:#ffcaca;font-size:14px;line-height:1.4}
    .secondary{display:none;margin-top:15px;background:#2a2a2a!important;color:#fff!important}
  </style>
</head>
<body>
<main>
  <h1>📤 Надіслати результат</h1>
  <p class="lead">Оберіть чат у Telegram</p>
  <button id="choose" type="button">📤 Вибрати чат</button>
  <a class="action secondary" id="fallback" href="#">↩️ Відкрити результат у ШИФРІ</a>
  <p id="note" class="note">Результат буде доступний у вибраному чаті. Оберіть його, щоб надіслати.</p>
  <p id="error" class="error"></p>
</main>
<script>
(function(){
  "use strict";
  var qs=new URLSearchParams(location.search);
  var gameDate=qs.get('gd')||'';
  var ticket=qs.get('ticket')||'';
  var bot=(qs.get('bot')||'Shyfr_ua_bot').replace(/^@/,'');
  var tg=window.Telegram&&window.Telegram.WebApp;
  var choose=document.getElementById('choose');
  var err=document.getElementById('error');
  var fallback=document.getElementById('fallback');
  var note=document.getElementById('note');
  function today(){
    var p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    var d={};p.forEach(function(x){if(x.type!=='literal')d[x.type]=x.value});
    return d.year+'-'+d.month+'-'+d.day;
  }
  function fail(message){err.textContent=message;err.style.display='block'}
  var isDate=/^\d{4}-\d{2}-\d{2}$/.test(gameDate) &&
             !Number.isNaN(Date.parse(gameDate+'T00:00:00Z')) &&
             gameDate<=today();
  if(!isDate||!/^[A-Za-z0-9_]{3,64}$/.test(bot)){
    choose.style.display='none';fail('Посилання некоректне. Відкрийте результат у боті.');
    return;
  }
  if(gameDate!==today()){
    note.textContent='Результат минулого дня також можна надіслати. Нові шанси за нього не нараховуються.';
  }
  if(ticket && /^[A-Za-z0-9_-]{20,64}$/.test(ticket)){
    fallback.href='https://t.me/'+encodeURIComponent(bot)+'?start='+encodeURIComponent('tgrefresh_'+ticket);
  }else{
    fallback.href='https://t.me/'+encodeURIComponent(bot);
  }
  try{if(tg&&tg.ready)tg.ready();if(tg&&tg.expand)tg.expand()}catch(e){}
  choose.addEventListener('click',function(){
    err.style.display='none';
    if(tg&&typeof tg.switchInlineQuery==='function'){
      try{
        // Unlike shareMessage(), this never uses the old prepared ID.
        // Telegram opens the native recipient selector for the inline query.
        tg.switchInlineQuery('shyfr_'+gameDate,['users','groups']);
        return;
      }catch(e){fail('Не вдалося відкрити список чатів. Спробуйте оновити Telegram.')}
    }else{
      fail('Для цієї версії Telegram вибір чату недоступний. Оновіть Telegram або відкрийте результат у боті.');
    }
    fallback.style.display='flex';
  });
})();
</script>
</body>
</html>

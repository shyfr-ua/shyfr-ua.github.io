<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111111">
  <meta name="shyfr-share-build" content="shyfr-ua-pages-18">
  <title>Поділитися результатом ШИФР</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px 16px}
    main{width:min(100%,520px)} h1{margin:0 0 10px;text-align:center;font-size:28px;line-height:1.15}.lead{margin:0 0 26px;text-align:center;opacity:.72;font-size:16px;line-height:1.4}
    button,a.action{width:100%;min-height:60px;border:0;border-radius:16px;padding:0 18px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;text-decoration:none}
    button:disabled{opacity:.55;cursor:default}.note{margin-top:20px;text-align:center;font-size:13px;line-height:1.45;opacity:.56}
    .error{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;background:#2b1c1c;color:#ffd7d7;font-size:14px;line-height:1.4}
    #returnBox{display:none;margin-top:14px}
  </style>
</head>
<body>
<main>
  <h1 id="title">📱 Поділитися результатом</h1>
  <p id="lead" class="lead">Натисніть кнопку нижче, щоб відкрити системне меню поширення.</p>
  <button id="share" type="button" disabled>📱 Відкрити меню поширення</button>
  <div id="returnBox">
    <a id="returnLink" class="action" href="#">↩️ Повернутися в ШИФР</a>
  </div>
  <p id="note" class="note">Якщо передумаєте, просто закрийте системне меню.</p>
  <div id="error" class="error"></div>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var ticket=q.get('ticket')||'';
  var gameDate=q.get('gd')||'';
  var platform=q.get('p')||'other';
  var bot=(q.get('bot')||'Shyfr_ua_bot').replace(/^@/,'');
  var errorBox=document.getElementById('error');
  var shareButton=document.getElementById('share');
  var note=document.getElementById('note');
  var title=document.getElementById('title');
  var lead=document.getElementById('lead');
  var returnBox=document.getElementById('returnBox');
  var returnLink=document.getElementById('returnLink');
  var preparedFile=null;
  var preparedError=false;

  function showError(message){errorBox.textContent=message;errorBox.style.display='block'}
  function clearError(){errorBox.style.display='none'}
  function decodeBase64Url(value){
    if(!value)return '';
    try{var padded=value.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-value.length%4)%4);var bytes=Uint8Array.from(atob(padded),function(c){return c.charCodeAt(0)});return new TextDecoder('utf-8',{fatal:false}).decode(bytes)}catch(e){return ''}
  }
  function kyivToday(){
    var parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    var values={};parts.forEach(function(part){if(part.type!=='literal')values[part.type]=part.value});return values.year+'-'+values.month+'-'+values.day
  }
  function parseResult(value){
    var lines=value.split(/\r?\n/).map(function(line){return line.trim()}).filter(Boolean);
    var header=lines[0]||'ШИФР';
    var match=header.match(/^ШИФР\s+#?(\d+)\s+(.+)$/i);
    var day=match?match[1]:'';
    var result=match?match[2]:header.replace(/^ШИФР\s*/i,'');
    var colors=new Set(['⚫','🟡','🟢']);
    var grid=[];
    var badge='';
    lines.slice(1).forEach(function(line){
      var cells=Array.from(line).filter(function(ch){return colors.has(ch)});
      if(cells.length===5){grid.push(cells);return}
      if(/^Telegram:/i.test(line)||/^@Shyfr_ua_bot$/i.test(line))return;
      if(!badge)badge=line;
    });
    return {header:header,day:day,result:result,grid:grid,badge:badge}
  }
  function drawFittedText(ctx,text,x,y,maxWidth,startSize,minSize,weight){
    if(!text)return;
    var size=startSize;
    while(size>minSize){ctx.font=(weight||'700')+' '+size+'px system-ui';if(ctx.measureText(text).width<=maxWidth)break;size-=2}
    ctx.font=(weight||'700')+' '+Math.max(minSize,size)+'px system-ui';ctx.fillText(text,x,y,maxWidth)
  }
  function canvasToBlob(canvas){return new Promise(function(resolve,reject){canvas.toBlob(function(blob){if(blob)resolve(blob);else reject(new Error('PNG'))},'image/png',1)})}
  async function buildImage(value,story){
    var parsed=parseResult(value);if(!parsed.grid.length)throw new Error('grid');
    var canvas=document.createElement('canvas');canvas.width=1080;canvas.height=story?1920:1080;var ctx=canvas.getContext('2d');if(!ctx)throw new Error('canvas');
    ctx.fillStyle='#101214';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    ctx.font=story?'800 86px system-ui':'700 72px system-ui';ctx.fillText(parsed.day?'ШИФР #'+parsed.day:'ШИФР',540,story?350:125);
    ctx.font=story?'800 72px system-ui':'700 56px system-ui';ctx.fillText(parsed.result||'',540,story?470:205);
    var rows=parsed.grid.length,cols=5,gapX=story?34:24,gapY=story?34:(rows>=6?14:20),areaTop=story?610:275,areaBottom=story?(parsed.badge?1260:1360):(parsed.badge?760:855),maxWidth=story?760:720;
    var areaHeight=areaBottom-areaTop;var diameter=Math.min(108,(maxWidth-gapX*(cols-1))/cols,(areaHeight-gapY*(rows-1))/rows);diameter=Math.max(58,diameter);var radius=diameter/2;
    var gridWidth=cols*diameter+(cols-1)*gapX,gridHeight=rows*diameter+(rows-1)*gapY,startX=540-gridWidth/2+radius,startY=areaTop+(areaHeight-gridHeight)/2+radius;
    var map={'⚫':'#4a4d51','🟡':'#ffd326','🟢':'#30c96b'};
    parsed.grid.forEach(function(row,ri){row.forEach(function(cell,ci){ctx.beginPath();ctx.arc(startX+ci*(diameter+gapX),startY+ri*(diameter+gapY),radius,0,Math.PI*2);ctx.fillStyle=map[cell]||'#4a4d51';ctx.fill()})});
    if(parsed.badge){ctx.fillStyle='#fff';drawFittedText(ctx,parsed.badge,540,story?1410:850,story?900:950,story?54:46,story?34:28,'800')}
    ctx.fillStyle='#fff';ctx.font=story?'700 52px system-ui':'700 46px system-ui';ctx.fillText('Telegram: @Shyfr_ua_bot',540,story?1580:970);
    if(story){ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='500 34px system-ui';ctx.fillText('5 літер · 6 спроб',540,1655)}
    var blob=await canvasToBlob(canvas);var name=story?'shyfr-instagram.png':'shyfr-threads.png';return new File([blob],name,{type:'image/png'})
  }

  var text=decodeBase64Url(q.get('t'))||q.get('text')||'';
  var startParam='socialdone_'+ticket;
  var webReturn='https://t.me/'+encodeURIComponent(bot)+'?start='+encodeURIComponent(startParam);
  var tgReturn='tg://resolve?domain='+encodeURIComponent(bot)+'&start='+encodeURIComponent(startParam);
  returnLink.href=webReturn;

  function markShareCompleted(){
    returnBox.style.display='block';
    note.textContent='Готово. Поверніться в ШИФР кнопкою нижче.';
    returnLink.href=tgReturn;
    returnLink.addEventListener('click',function(){
      setTimeout(function(){window.location.href=webReturn},900);
    },{once:true});
  }

  async function sharePrepared(){
    clearError();
    if(typeof navigator.share!=='function'){
      showError('Системне меню поширення недоступне в цьому браузері. Відкрийте сторінку в Chrome, Safari або іншому звичайному браузері.');
      return;
    }
    try{
      if(platform==='other'){
        await navigator.share({text:text});
      }else{
        if(preparedError||!preparedFile){showError('Не вдалося створити картинку результату. Поверніться в бот і спробуйте ще раз.');return}
        var data={files:[preparedFile]};
        if(typeof navigator.canShare==='function'&&!navigator.canShare(data)){
          showError('Цей браузер не підтримує поширення PNG-файлів.');
          return;
        }
        await navigator.share(data);
      }
      markShareCompleted();
    }catch(err){
      if(err&&err.name==='AbortError'){
        note.textContent='Поширення скасовано. Шанси не нараховано.';
        return;
      }
      showError('Не вдалося відкрити системне меню поширення.');
    }
  }

  if(!ticket||!text||!gameDate||gameDate!==kyivToday()){
    shareButton.disabled=true;showError('Це посилання неактуальне. Поверніться в бот і відкрийте поширення ще раз.');return
  }
  if(!/^[A-Za-z0-9_-]{20,64}$/.test(ticket)||!/^[A-Za-z0-9_]{3,64}$/.test(bot)){
    shareButton.disabled=true;showError('Некоректні дані поширення. Поверніться в бот і спробуйте ще раз.');return
  }

  if(platform==='instagram'){
    title.textContent='📷 Instagram';lead.textContent='Підготуємо вертикальну картинку для поширення.';
    buildImage(text,true).then(function(file){preparedFile=file;shareButton.disabled=false}).catch(function(){preparedError=true;shareButton.disabled=false});
  }else if(platform==='threads'){
    title.textContent='🧵 Threads';lead.textContent='Підготуємо квадратну картинку для поширення.';
    buildImage(text,false).then(function(file){preparedFile=file;shareButton.disabled=false}).catch(function(){preparedError=true;shareButton.disabled=false});
  }else{
    title.textContent='📱 Інші соцмережі';lead.textContent='Поділіться текстом результату через системне меню.';
    shareButton.disabled=false;
  }
  shareButton.addEventListener('click',sharePrepared);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111111">
  <meta name="shyfr-share-build" content="shyfr-ua-pages-16">
  <title>Поділитися результатом ШИФР</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px 16px}
    main{width:min(100%,520px)} h1{margin:0 0 10px;text-align:center;font-size:28px;line-height:1.15}.lead{margin:0 0 26px;text-align:center;opacity:.72;font-size:16px;line-height:1.4}
    .share-list{display:grid;gap:12px} button{width:100%;min-height:60px;border:0;border-radius:16px;padding:0 18px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;background:#fff;color:#111}
    button.secondary{background:#232323;color:#fff}.note{margin-top:20px;text-align:center;font-size:13px;line-height:1.45;opacity:.56}
    .error{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;background:#2b1c1c;color:#ffd7d7;font-size:14px;line-height:1.4}
  </style>
</head>
<body>
<main>
  <h1>📱 Опублікувати результат</h1>
  <p class="lead">Оберіть, куди поділитися</p>
  <div class="share-list">
    <button id="threads" type="button">Threads</button>
    <button id="instagram" type="button">Instagram</button>
    <button id="other" class="secondary" type="button">Інші соцмережі</button>
  </div>
  <p class="note">Після вибору відкриється зовнішній браузер із системним меню поширення.</p>
  <div id="error" class="error"></div>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var ticket=q.get('ticket')||'';
  var gameDate=q.get('gd')||'';
  var text=q.get('t')||'';
  var bot=(q.get('bot')||'Shyfr_ua_bot').replace(/^@/,'');
  var tg=window.Telegram&&window.Telegram.WebApp;
  var errorBox=document.getElementById('error');

  function showError(message){errorBox.textContent=message;errorBox.style.display='block'}
  function kyivToday(){
    var parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    var values={};parts.forEach(function(part){if(part.type!=='literal')values[part.type]=part.value});return values.year+'-'+values.month+'-'+values.day
  }
  function externalUrl(platform){
    var u=new URL('/social-share.html',location.origin);
    u.searchParams.set('v','51062');
    u.searchParams.set('t',text);
    u.searchParams.set('gd',gameDate);
    u.searchParams.set('ticket',ticket);
    u.searchParams.set('bot',bot);
    u.searchParams.set('p',platform);
    return u.toString();
  }
  function openExternal(platform){
    errorBox.style.display='none';
    if(!ticket||!text||!gameDate||gameDate!==kyivToday()){
      showError('Не вдалося відкрити актуальний результат. Поверніться в бот і спробуйте ще раз.');
      return;
    }
    if(!tg||typeof tg.openLink!=='function'){
      showError('Відкрийте цей екран через кнопку «📱 Відкрити соцмережі» у боті.');
      return;
    }
    try{
      tg.openLink(externalUrl(platform),{try_instant_view:false});
    }catch(e){
      showError('Не вдалося відкрити зовнішній браузер. Спробуйте ще раз.');
    }
  }

  try{if(tg&&typeof tg.ready==='function')tg.ready();if(tg&&typeof tg.expand==='function')tg.expand()}catch(e){}
  document.getElementById('threads').addEventListener('click',function(){openExternal('threads')});
  document.getElementById('instagram').addEventListener('click',function(){openExternal('instagram')});
  document.getElementById('other').addEventListener('click',function(){openExternal('other')});
})();
</script>
</body>
</html>

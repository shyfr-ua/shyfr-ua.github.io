<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111111">
  <meta name="shyfr-share-build" content="shyfr-ua-pages-12">
  <title>Поділитися результатом ШИФР</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root { color-scheme: dark; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#111; color:#fff; display:grid; place-items:center; padding:24px 16px; }
    main { width:min(100%,520px); text-align:center; }
    h1 { margin:0 0 10px; font-size:28px; line-height:1.15; }
    p { margin:0 0 24px; opacity:.72; font-size:16px; line-height:1.45; }
    button { width:100%; min-height:60px; border:0; border-radius:16px; padding:0 18px; background:#fff; color:#111; font:inherit; font-size:18px; font-weight:700; cursor:pointer; }
    .note { margin-top:18px; font-size:13px; opacity:.5; }
    .error { display:none; margin-top:16px; padding:12px 14px; border-radius:12px; background:#2b1c1c; color:#ffd7d7; font-size:14px; line-height:1.4; }
  </style>
</head>
<body>
<main>
  <h1>📱 Опублікувати результат</h1>
  <p>Натисніть кнопку нижче та оберіть потрібну соцмережу.</p>
  <button id="share" type="button">📱 Опублікувати результат</button>
  <div id="note" class="note">Threads, Instagram та інші застосунки з'являться у системному меню поширення.</div>
  <div id="error" class="error"></div>
</main>
<script>
(() => {
  const q = new URLSearchParams(location.search);

  function decodeBase64Url(value) {
    if (!value) return '';
    try {
      const padded = value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4);
      const bytes = Uint8Array.from(atob(padded), c => c.charCodeAt(0));
      return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
    } catch (_) { return ''; }
  }

  function kyivToday() {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Kyiv', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    const values = {};
    for (const part of parts) if (part.type !== 'literal') values[part.type] = part.value;
    return `${values.year}-${values.month}-${values.day}`;
  }

  const text = decodeBase64Url(q.get('t')) || q.get('text') || '';
  const ticket = q.get('ticket') || '';
  const gameDate = q.get('gd') || '';
  const external = q.get('external') === '1';
  const button = document.getElementById('share');
  const errorBox = document.getElementById('error');
  const note = document.getElementById('note');
  const tg = window.Telegram && window.Telegram.WebApp;

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
  }

  if (!text) {
    button.disabled = true;
    showError('Не вдалося отримати результат. Поверніться в ШИФР і відкрийте поширення ще раз.');
    return;
  }

  if (gameDate && gameDate !== kyivToday()) {
    button.disabled = true;
    showError('Поділитися можна лише результатом сьогоднішнього ШИФРУ.');
    return;
  }

  try {
    if (tg && typeof tg.ready === 'function') tg.ready();
    if (tg && typeof tg.expand === 'function') tg.expand();
  } catch (_) {}

  function silentlyCredit() {
    if (!ticket || !tg || typeof tg.sendData !== 'function') return;
    try {
      tg.sendData(JSON.stringify({ type: 'social_share_started', ticket }));
    } catch (_) {}
  }

  async function systemShare() {
    errorBox.style.display = 'none';
    if (typeof navigator.share !== 'function') {
      try {
        await navigator.clipboard.writeText(text);
        note.textContent = 'Текст результату скопійовано. Вставте його у потрібну соцмережу.';
      } catch (_) {
        showError('Системне меню поширення недоступне в цьому браузері.');
      }
      return;
    }
    try {
      await navigator.share({ text });
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      showError('Не вдалося відкрити системне меню поширення.');
    }
  }

  button.addEventListener('click', async () => {
    errorBox.style.display = 'none';

    if (!external && tg && typeof tg.openLink === 'function') {
      const target = new URL(window.location.href);
      target.searchParams.set('external', '1');
      try {
        tg.openLink(target.toString(), { try_instant_view: false });
        silentlyCredit();
        return;
      } catch (_) {}
    }

    try {
      await systemShare();
      if (!external) silentlyCredit();
    } catch (_) {}
  });
})();
</script>
</body>
</html>
